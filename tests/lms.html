<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<!-- LMS giả lập SCORM 1.2: đặt window.API rồi mở gói trong iframe "course/". Dùng cho test tự động. -->
<script>
var store = JSON.parse(sessionStorage.getItem("lms") || "{}");
if (!store["cmi.core.lesson_status"]) store["cmi.core.lesson_status"]="not attempted";
store["cmi.core.student_name"]="Nguyen, Test";
window.lmsLog=[];
window.API={
 LMSInitialize:function(){lmsLog.push("init");return "true"},
 LMSGetValue:function(k){return store[k]||""},
 LMSSetValue:function(k,v){store[k]=String(v);lmsLog.push(k+"="+String(v).slice(0,60));return "true"},
 LMSCommit:function(){sessionStorage.setItem("lms",JSON.stringify(store));return "true"},
 LMSFinish:function(){sessionStorage.setItem("lms",JSON.stringify(store));lmsLog.push("finish");return "true"},
 LMSGetLastError:function(){return "0"}
};
window.lmsStore=function(){return store};
</script>
<!-- lms.html?course=course-ref mở gói ở thư mục khác (test khóa Tham khảo) -->
<iframe id="f" style="width:1280px;height:900px;border:0" allow="autoplay"></iframe>
<script>document.getElementById("f").src = (new URLSearchParams(location.search).get("course") || "course") + "/index.html";</script>
</body></html>
