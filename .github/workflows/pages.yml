# Chạy toàn bộ test + đưa Builder lên GitHub Pages mỗi khi main thay đổi.
# Lần đầu: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Builder

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: builder/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: npm ci
        working-directory: builder
      # test logic + 43 test Player + test giao diện Builder; cũng tạo builder/dist để đưa lên Pages
      - run: bash tests/run_all.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: anh-chup-test
          path: out/
          retention-days: 7
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: builder/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
