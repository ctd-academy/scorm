# Chuẩn bị máy cho Copilot coding agent (giao issue cho Copilot trên GitHub):
# cài đủ Node, thư viện, Chromium, ffmpeg để Copilot tự chạy được "bash tests/run_all.sh" trước khi mở Pull Request.
# Tên job phải đúng là "copilot-setup-steps". Bấm "Run workflow" ở tab Actions để thử file này chạy được không.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: builder/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: npm ci
        working-directory: builder
